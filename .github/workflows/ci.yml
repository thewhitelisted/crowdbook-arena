name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux with the browser test; macOS on Apple silicon checks that everything installs
        # from wheels, with nothing to compile.
        include:
          - os: ubuntu-latest
            browser: true
          - os: macos-14
            browser: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          if [ "${{ matrix.browser }}" = "true" ]; then
            uv sync --locked --group browser
            uv run playwright install --with-deps chromium
          else
            # Every dependency from a wheel: none of them may be built from source.
            uv sync --locked $(for p in crowdbook-engine numpy sqlalchemy greenlet websockets \
              starlette uvicorn; do echo --no-build-package $p; done)
          fi
      - name: Test
        run: uv run pytest -q

  docker:
    # The image builds, starts, serves the API, and runs a live round; the compose file is valid.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t crowdbook-arena .
      - name: Smoke test
        run: |
          docker run -d --name arena -p 8000:8000 crowdbook-arena
          for i in $(seq 30); do curl -sf http://127.0.0.1:8000/api/kinds && break; sleep 1; done
          game=$(curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"host_name":"ci"}' http://127.0.0.1:8000/api/games)
          code=$(echo "$game" | python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          token=$(echo "$game" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -sf -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $token" \
            -d '{"kind":"live","market":"calm","duration_s":5,"speed":5}' \
            http://127.0.0.1:8000/api/games/$code/rounds
          sleep 4
          curl -sf http://127.0.0.1:8000/api/games/$code/rounds/1 | tee /dev/stderr \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["round"]["status"]=="finished", r'
          docker logs arena
      - name: Compose file
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile postgres config -q
